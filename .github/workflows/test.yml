name: Homebrew

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homebrew-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Install and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, ubuntu-24.04, ubuntu-24.04-arm]
    env:
      HOMEBREW_NO_ANALYTICS: '1'
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      HOMEBREW_NO_ASK: '1'
      HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@d482da0e602890d3160aade42e72c8556103bf04
        with:
          core: false
          cask: false
          stable: true
      - name: Verify checked-out tap revision
        shell: bash
        run: |
          test "$(git -C "$(brew --repository fredgnr/tap)" rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Formula style
        run: brew style fredgnr/tap/gopls-mcp-proxy
      - name: Install release binary without dependencies
        shell: bash
        run: |
          test -z "$(brew deps --include-build --include-test fredgnr/tap/gopls-mcp-proxy)"
          brew list --formula | sort > "$RUNNER_TEMP/formulas-before.txt"
          brew install --formula fredgnr/tap/gopls-mcp-proxy
          brew list --formula | sed '/^gopls-mcp-proxy$/d' | sort > "$RUNNER_TEMP/formulas-after.txt"
          diff -u "$RUNNER_TEMP/formulas-before.txt" "$RUNNER_TEMP/formulas-after.txt"
      - name: Audit formula
        run: brew audit --strict --formula fredgnr/tap/gopls-mcp-proxy
      - name: Self-contained proxy smoke test
        run: brew test fredgnr/tap/gopls-mcp-proxy
      - name: Check out the shared MCP integration test
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: fredgnr/gopls-mcp-proxy
          # Pin the reviewed smoke test independently of later upstream changes.
          ref: 55fd64807ecff62e7164ed1582a27980140bcb60
          path: proxy-source
          sparse-checkout: scripts/homebrew/smoke.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Set up user-managed Go for integration tests only
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.2'
          cache: false
      - name: Install user-managed gopls for integration tests only
        env:
          GOBIN: ${{ runner.temp }}/gopls-bin
          GOTOOLCHAIN: local
        run: go install golang.org/x/tools/gopls@v0.24.0
      - name: Real gopls MCP with user-configured PATH and explicit backend
        shell: bash
        run: |
          python3 proxy-source/scripts/homebrew/smoke.py \
            --proxy "$(brew --prefix)/bin/gopls-mcp-proxy" \
            --gopls "$RUNNER_TEMP/gopls-bin/gopls" --go "$(command -v go)"
      - name: Check stable command and uninstall
        shell: bash
        run: |
          test -x "$(brew --prefix)/bin/gopls-mcp-proxy"
          "$(brew --prefix)/bin/gopls-mcp-proxy" --version
          brew uninstall --formula fredgnr/tap/gopls-mcp-proxy
          test ! -e "$(brew --prefix)/bin/gopls-mcp-proxy"
          test ! -L "$(brew --prefix)/bin/gopls-mcp-proxy"
